<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo - Iniciar Sesión</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('nodo_theme')||'light')</script>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-layout">

    <!-- Panel izquierdo: marca -->
    <div class="login-brand">
      <canvas class="network-canvas" id="brandNetwork"></canvas>

      <div class="brand-tagline">
        <h2>Tu banco,<br><span class="highlight">más simple.</span></h2>
        <p>Gestioná tu dinero con la libertad y claridad que siempre buscaste.</p>
      </div>

      <p class="brand-footer">© 2026 Nodo. El nodo de tu crecimiento.</p>
    </div>

    <!-- Panel derecho: formulario + tarjeta -->
    <div class="login-form-panel">

      <div class="login-form-inner">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <h1 class="login-form-title" style="margin-bottom:0;">Bienvenido</h1>
          <button id="themeToggleBtn" class="btn-theme-toggle" title="Modo oscuro"><i class="fas fa-moon"></i></button>
        </div>
        <p class="login-form-sub">Ingresá o creá tu cuenta para continuar.</p>

        <div class="tabs">
          <button class="tab active" data-target="login">Iniciar sesión</button>
          <button class="tab" data-target="register">Registrarse</button>
        </div>

        <form id="loginForm" class="login-card">
          <h2>Hola de nuevo</h2>
          <input type="email"    id="loginEmail"    placeholder="Correo electrónico" required>
          <input type="password" id="loginPassword" placeholder="Contraseña" required>
          <button type="submit" class="btn-primary">Ingresar</button>
        </form>

        <form id="registerForm" class="login-card hidden">
          <h2>Crear cuenta</h2>
          <input type="text"     id="registerNombre"   placeholder="Nombre" required>
          <input type="text"     id="registerApellido" placeholder="Apellido" required>
          <input type="text"     id="registerDni"      placeholder="DNI" required>
          <input type="email"    id="registerEmail"    placeholder="Email" required>
          <input type="password" id="registerPassword" placeholder="Contraseña" required>
          <button type="submit" class="btn-primary">Empezar ahora</button>
        </form>

        <p class="login-footer">© 2026 Nodo · El nodo de tu crecimiento.</p>
      </div>


    </div>
  </div>

  <!-- Red de nodos gris fija abajo a la derecha -->
  <canvas id="loginNetwork" width="640" height="520" class="login-network-canvas"></canvas>

  <div id="syncToast" class="sync-toast hidden">
    <i class="fas fa-check-circle"></i>
    <span id="syncToastMsg"></span>
  </div>

  <script src="./network.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/main.js"></script>
  <script>
    initNetwork(document.getElementById('brandNetwork'), { color: 'rgba(255,255,255,', count: 50, maxDist: 140, speed: 0.25 });

    initNetwork(document.getElementById('loginNetwork'), {
      color: () => localStorage.getItem('nodo_theme') === 'dark' ? 'rgba(255,255,255,' : 'rgba(100,116,139,',
      count: 65,
      maxDist: 155,
      nodeOpacity: 0.92,
      lineOpacity: 0.6,
      speed: 0.2
    });
  </script>
</body>
</html>
