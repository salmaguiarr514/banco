<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo - Iniciar Sesión</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="login-layout">
    <!-- Logo Nodo -->
    <div class="logo-container" style="justify-content: center; margin-bottom: 2rem;">
      <div class="logo-icon">N</div>
      <span class="brand-name">NODO</span>
    </div>

    <section class="login-panel">
      <h1 class="login-title">Tu banco, <br><span class="highlight">más simple.</span></h1>
      <p class="login-subtitle">Gestión simple de cuentas, saldo y transferencias</p>

      <div class="tabs">
        <button class="tab active" data-target="login">Iniciar Sesión</button>
        <button class="tab" data-target="register">Registrarse</button>
      </div>

      <form id="loginForm" class="card login-form">
        <h2>Bienvenido de nuevo</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Ingresar</button>
      </form>

      <form id="registerForm" class="card login-form hidden">
        <h2>Crear cuenta</h2>
        <input type="text" id="registerNombre" placeholder="Nombre" required>
        <input type="text" id="registerApellido" placeholder="Apellido" required>
        <input type="text" id="registerDni" placeholder="DNI" required>
        <input type="email" id="registerEmail" placeholder="Email" required>
        <input type="password" id="registerPassword" placeholder="Password" required>
        <button type="submit">Registrarme</button>
      </form>
    </section>

    <footer class="login-footer">
      <p>© 2026 Nodo. El nodo de tu crecimiento.</p>
    </footer>
  </main>

  <script src="./app.js"></script>
  <script>
    // Toggle entre login y register
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        
        tab.classList.add('active');
        const target = tab.dataset.target;
        document.getElementById(target + 'Form').classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
